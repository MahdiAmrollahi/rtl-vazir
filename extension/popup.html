<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>RTL Vazir</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font: 13px/1.5 -apple-system, "Segoe UI", Tahoma, sans-serif;
    margin: 0; padding: 12px 14px; width: 240px;
    background: #fff; color: #111;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #1c1c1e; color: #f2f2f7; }
    .row { border-color: #2c2c2e !important; }
    a { color: #7aa2f7; }
  }
  h1 {
    font-size: 13px; font-weight: 600; margin: 0 0 10px;
    display: flex; align-items: center; gap: 6px;
  }
  h1::before {
    content: "\u0622"; display: inline-block;
    font: 600 16px Tahoma, sans-serif;
    color: #2563eb;
  }
  .row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 0; border-top: 1px solid #eee;
  }
  .row label { cursor: pointer; user-select: none; }
  .row small { display: block; color: #888; font-size: 11px; margin-top: 2px; }
  .switch { position: relative; width: 36px; height: 20px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; inset: 0; background: #ccc;
    border-radius: 20px; transition: .15s; cursor: pointer;
  }
  .slider::before {
    content: ""; position: absolute; left: 2px; top: 2px;
    width: 16px; height: 16px; background: #fff; border-radius: 50%;
    transition: .15s;
  }
  .switch input:checked + .slider { background: #2563eb; }
  .switch input:checked + .slider::before { transform: translateX(16px); }
  footer { margin-top: 10px; font-size: 11px; color: #888; }
  footer a { color: #2563eb; text-decoration: none; cursor: pointer; }
  .status { font-size: 11px; color: #666; margin-top: 4px; }
</style>
</head>
<body>
  <h1>RTL Vazir</h1>

  <div class="row">
    <div>
      <label for="enabled">Auto direction</label>
      <small>Sets dir="auto" on Persian/Arabic text</small>
    </div>
    <label class="switch">
      <input type="checkbox" id="enabled" />
      <span class="slider"></span>
    </label>
  </div>

  <div class="row">
    <div>
      <label for="fontOn">Vazir font</label>
      <small>Apply Persian font to chat text</small>
    </div>
    <label class="switch">
      <input type="checkbox" id="fontOn" />
      <span class="slider"></span>
    </label>
  </div>

  <footer>
    <a id="reset">Reset to defaults</a>
    <div class="status" id="status"></div>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
